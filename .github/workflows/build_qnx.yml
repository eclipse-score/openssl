name: Bazel Build (QNX)
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:
jobs:
  qnx-build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: QNX x86_64
            bazel-config: x86_64-qnx
            working-directory: "."
            bazel-target: "//..."
            bazel-disk-cache: x86_64-qnx
          - name: QNX aarch64
            bazel-config: aarch64-qnx
            working-directory: "."
            bazel-target: "//..."
            bazel-disk-cache: aarch64-qnx
    uses: eclipse-score/cicd-workflows/.github/workflows/qnx-build.yml@77760ad7cdb83fbb157dffa3ba30cc60fe0e141e
    permissions:
      contents: read
      pull-requests: read
    with:
      bazel-target: ${{ matrix.bazel-target }}
      bazel-config: ${{ matrix.bazel-config }}
      credential-helper: ".github/tools/qnx_credential_helper.py"
      bazel-disk-cache: ${{ matrix.bazel-disk-cache }}
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
